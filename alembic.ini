[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
# The database URL is never stored here. migrations/env.py takes it from
# config.attributes["database_url"] (tests) or from Settings (.env / environment).

# Logging for the alembic CLI (and so for the container start), so each applied
# migration, and the one that failed, shows up in `docker compose logs`. Tests that run
# migrations in-process skip this (see migrations/env.py).
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
