[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "integrationkit"
version = "0.1.0"
description = "Reliable webhook processing for simulated Stripe-style events."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.142.4",
    "uvicorn==0.54.0",
    "sqlalchemy==2.1.4",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
    "pydantic-settings==2.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "ruff==0.16.10",
]
# Test-only: official Stripe library, used solely to cross-check signatures offline.
test = [
    "stripe==16.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
