# Local development services. All credentials come from .env and are fake.
services:
  db:
    image: postgres:16.15-bookworm
    environment:
      POSTGRES_USER: integrationkit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: integrationkit
    ports:
      # Bound to localhost only; host port configurable because 5432 is often taken.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integrationkit -d integrationkit"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
